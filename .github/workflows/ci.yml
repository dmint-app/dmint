name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dmint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install ".[dev]"

      - name: Code quality (Ruff linter & formatter)
        run: |
          ruff check .
          ruff format --check .

      - name: Type checking (Mypy)
        run: |
          mypy src/

      - name: Run test suite
        env:
          PYTHONPATH: src
          DMINT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dmint_test
        run: |
          pytest -v tests/

      - name: Verify package build
        run: |
          python -m build
          twine check dist/*

      - name: Verify clean wheel installation & entrypoints
        run: |
          python -m venv test_env
          test_env/bin/pip install --upgrade pip
          test_env/bin/pip install dist/*.whl
          test_env/bin/dmint --version
          test_env/bin/dmint --help
          test_env/bin/dmint-mcp --help
          test_env/bin/dmint-dashboard --help
          rm -rf test_env

  docs:
    name: Docs Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Build docs site
        working-directory: docs
        run: npm run build

