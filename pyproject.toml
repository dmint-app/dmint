[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dmint"
version = "2.0.0"
description = "Deterministic authorization and security enforcement for AI-agent tool execution"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Dmint Authors" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cryptography>=42,<51",
    "rfc8785>=0.1.2,<0.2",
    "questionary>=2.0.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9.0",
    "psycopg[binary]>=3.1.0",
]
mcp = [
    "mcp>=2.2.0,<3.0.0",
    "anyio>=4.9",
    "starlette>=0.27",
    "uvicorn>=0.31",
    "httpx2>=2.5",
]
dashboard = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.31,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9,<1.0",
]
all = [
    "dmint[mcp,dashboard,postgres]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "build",
    "twine",
    "pre-commit>=3.7.0",
    "commitizen>=3.29.0",
    "dmint[all]",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "dmint[all]",
]

[project.scripts]
dmint = "dmint.cli.__main__:main"
dmint-mcp = "dmint.mcp.__main__:main"
dmint-dashboard = "dmint.dashboard.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dmint" = ["py.typed"]
"dmint.core" = ["py.typed", "storage/*.sql"]
"dmint.cli" = ["py.typed", "prompts/*.md"]
"dmint.mcp" = ["py.typed"]
"dmint.dashboard" = ["py.typed", "templates/**/*.html", "static/**/*"]
"dmint.skills" = ["py.typed", "skills/**/*.md", "skills/*.md"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
"src/dmint/__init__.py" = ["F401", "F403"]
"src/dmint/*.py" = ["F401", "F403"]
"src/dmint/storage/*.py" = ["F401", "F403"]
"tests/**" = ["F401", "F811", "E722", "E402", "E702", "E731", "F841", "F601", "W293", "W291", "F541"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true
check_untyped_defs = true


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
