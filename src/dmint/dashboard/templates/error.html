{% extends "base.html" %}
{% block title %}Dmint — {{ status_code }}{% endblock %}

{% block content %}

<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:45vh;text-align:center;gap:1.25rem;padding:3rem 1rem;">
  <div style="font-family:var(--font-mono);font-size:4.5rem;font-weight:700;color:var(--text-dim);line-height:1;letter-spacing:-0.03em;">{{ status_code }}</div>
  <h1 style="font-size:1.15rem;font-weight:600;color:var(--text);margin:0;">{{ detail }}</h1>
  <a href="/" class="d-btn d-btn-ghost" style="margin-top:0.75rem;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
    </svg>
    Back to Dashboard
  </a>
</div>

{% endblock %}
